name: bakeout
description: "BakeOut: food-first dating with an AI wingman"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  image_picker: ^1.2.4
  cross_file: ^0.3.5
  flutter_litert: ^3.9.4
  web: ^1.1.1
  flutter_animate: ^4.5.2
  image: ^4.12.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_storage: ^14.0.0
  flutter_card_swiper: ^7.2.0
  rive: 0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/mascots/
    - assets/mascots/rive/
    - assets/models/mobile_facenet.tflite
    - assets/recipes/library.json

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
