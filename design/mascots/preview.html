<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BakeOut — Cherry mascot set</title>
<style>
  body { margin: 0; background: #FFF9F3; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #29252A; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  h1 { color: #A71938; margin: 0 0 4px; }
  p { color: #7b6f73; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  figure { margin: 0; background: #FFF0F2; border-radius: 18px; padding: 10px; text-align: center; }
  figure.cream { background: #FFF9F3; border: 1px solid #f1dfe2; }
  img { width: 100%; height: auto; display: block; }
  figcaption { font-size: 12px; font-weight: 700; margin-top: 6px; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  figure:hover img { animation: bob 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cherry mascot set</h1>
  <p>Transparent PNGs on BakeOut's Soft Pink and Warm Cream. Hover a card to preview a gentle bounce.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
  const names = ["cherry_duo_welcome", "cherry_duo_match", "cherry_duo_verify", "cherry_duo_cooking",
    "cherry_boy_hello", "cherry_girl_hello", "cherry_boy_cheer", "cherry_girl_cheer",
    "cherry_boy_planning", "cherry_girl_planning", "cherry_boy_goodbye", "cherry_girl_goodbye",
    "cherry_boy_tryagain", "cherry_girl_tryagain", "app_icon"];
  const grid = document.getElementById("grid");
  names.forEach((n, i) => {
    const f = document.createElement("figure");
    if (i % 2) f.className = "cream";
    f.innerHTML = '<img src="' + n + '.png" alt="' + n + '"><figcaption>' + n + "</figcaption>";
    grid.appendChild(f);
  });
</script>
</body>
</html>
